# this list for the first time scores 0.5 on H1 (0.6 if the port is >= 49152).
common_ports: [20, 21, 22, 25, 53, 67, 68, 80, 110, 123, 137, 138, 139, 143, 389, 443, 445, 465, 587, 636,
               853, 993, 995, 1900, 3478, 3479, 3480, 3481, 5222, 5223, 5228, 5353, 5355, 7680, 8080, 8443, 19302]

# Ports strongly associated with C2 / backdoors / remote shells. Any use scores 1.0 on H1.
