[project]
name = "netsentry"
version = "0.1.0"
description = "On-device network behaviour monitor for applications"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Nainika Pathak" }]
dependencies = [
  "psutil>=6.0",
  "scapy>=2.6",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "tldextract>=5.0",
  "typer>=0.12",
  "textual>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "ruff>=0.5"]

[project.scripts]
netsentry = "netsentry.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
netsentry = ["storage/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
